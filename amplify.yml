version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify serves the export at the domain root, so build without the /IP-6 base path
        # that the GitHub Pages deployment uses.
        - export SITE_TARGET=sites
        # Public origin for canonical links and robots.txt.
        - export SITE_URL="https://www.ip-6.net"
        - npm run build
  artifacts:
    # The app runs on the WEB_COMPUTE platform, which requires the .next folder.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
